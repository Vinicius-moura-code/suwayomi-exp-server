# Prometheus scrape config for local Suwayomi-Server development.
# App runs on the host (scripts/dev/run.sh); Prometheus runs in Docker.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: suwayomi
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - host.docker.internal:4567
        labels:
          app: suwayomi-server
          env: local
