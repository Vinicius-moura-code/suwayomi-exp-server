name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_extra:
        description: "Optional extra tag (e.g. stable). Always also pushes the git tag / latest."
        required: false
        default: "stable"

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push Docker Hub image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          path: suwayomi-exp-server

      - name: Checkout ExpUI
        uses: actions/checkout@v4
        with:
          repository: Vinicius-moura-code/suwayomi-exp-ui
          path: suwayomi-exp-ui
          # Use a PAT if the UI repo is private:
          # token: ${{ secrets.UI_REPO_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Build ExpUI
        working-directory: suwayomi-exp-ui
        env:
          CI: "true"
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec next build
          REV="r$(git rev-list HEAD --count)"
          echo "${REV}" > build/revision
          echo "ExpUI revision=${REV}"

      - name: Stage ExpUI into docker context
        run: |
          rm -rf suwayomi-exp-server/docker/expui
          mkdir -p suwayomi-exp-server/docker/expui
          cp -a suwayomi-exp-ui/build/. suwayomi-exp-server/docker/expui/

      - name: Build server jar
        working-directory: suwayomi-exp-server
        env:
          ProductName: Suwayomi-Exp-Server
          # Extra guard if user gradle.properties is ignored for any reason
          GRADLE_OPTS: -Xmx6144m -Dorg.gradle.daemon=false
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
          ./gradlew :server:shadowJar --no-daemon --stacktrace

      - name: Stage jar
        working-directory: suwayomi-exp-server
        run: |
          JAR="$(ls -1 server/build/Suwayomi-Exp-Server-*.jar | head -n1)"
          cp -f "${JAR}" docker/server.jar
          echo "JAR=${JAR}" >> "$GITHUB_ENV"
          echo "Using jar ${JAR}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/suwayomi-exp-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag_extra || 'stable' }},enable=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: suwayomi-exp-server
          file: suwayomi-exp-server/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
